name: deploy site

on:
  # 1. code changes
  push:
    branches: [main]
  # 2. content changes — the API fires this after a save in the admin
  repository_dispatch:
    types: [content-updated]
  # 3. manual rebuild
  workflow_dispatch:

# A burst of admin saves fires a burst of dispatches. Collapse them: keep the
# newest, cancel the ones already superseded.
concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Why this run happened
        run: echo "triggered by ${{ github.event_name }}"

      - name: Build static site
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}
        run: npm run build

      - name: Fail if the build produced no content
        run: |
          test -f out/index.html || { echo "::error::no out/index.html"; exit 1; }
          pages=$(find out -name '*.html' | wc -l)
          echo "built $pages pages"
          [ "$pages" -ge 8 ] || { echo "::error::only $pages pages, expected >= 8"; exit 1; }
          # "NEEL BOSE" is a hard-coded fallback and survives an API outage, so
          # assert on real database content instead.
          title=$(curl -fsS --max-time 20 "${{ secrets.API_URL }}/api/projects/" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['title'][:18] if d else '')")
          if [ -z "$title" ]; then echo "::error::API returned no projects"; exit 1; fi
          grep -qF "$title" out/projects/index.html \
            || { echo "::error::built pages have no live content — API unreachable during build"; exit 1; }
          echo "live content confirmed: $title"

      # TEMPORARY DIAGNOSTIC - reports via ::error:: so it lands in Annotations.
      - name: Verify OIDC inputs
        run: |
          curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" > /tmp/t.json
          SUB=$(python3 -c "
          import json, base64
          t = json.load(open('/tmp/t.json'))['value']
          pl = t.split('.')[1]; pl += '=' * (-len(pl) % 4)
          print(json.loads(base64.urlsafe_b64decode(pl))['sub'])
          ")
          EXPECTED="arn:aws:iam::814808959987:role/portfolio-github-actions-deploy"
          ACTUAL="${{ secrets.AWS_ROLE_ARN }}"
          echo "::error::OIDC sub = $SUB"
          if [ -z "$ACTUAL" ]; then
            echo "::error::AWS_ROLE_ARN secret is EMPTY or not set on this repo"
          elif [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "::error::AWS_ROLE_ARN is CORRECT (len ${#ACTUAL})"
          else
            echo "::error::AWS_ROLE_ARN is WRONG - len ${#ACTUAL}, expected ${#EXPECTED}. Re-paste it."
          fi

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        env:
          BUCKET: ${{ secrets.SITE_BUCKET }}
        run: |
          # hashed assets are immutable; HTML must always revalidate
          aws s3 sync out "s3://$BUCKET" --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable" --only-show-errors
          aws s3 sync out "s3://$BUCKET" --delete \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate" --only-show-errors

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DIST_ID }}" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          echo "invalidation $id created"

      - name: Summary
        run: |
          echo "### Site published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- trigger: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ secrets.SITE_URL }}" >> "$GITHUB_STEP_SUMMARY"
